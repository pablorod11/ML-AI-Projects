name: Imperial checkpoint verification
on:
  push:
    branches: [imperial-checkpoint-security-verification]
    paths: ["imperial-llm/**", ".github/workflows/imperial-verification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: imperial-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install CPU runtime and project tests
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-linux-verified.txt
          python -m pip install --no-deps -e .
          python -m pip freeze > verified-environment.txt
      - name: Checkpoint security and compatibility
        run: python -m pytest -q tests/test_checkpoint_security.py tests/test_checkpoint_io.py tests/test_checkpoint_resume.py
      - name: Browser inference and generation parity
        if: ${{ !cancelled() }}
        run: |
          node space/test_inference.cjs
          node space/test_generation.cjs
      - name: Full Python suite
        if: ${{ !cancelled() }}
        run: python -m pytest -q --junitxml=verification-tests.xml
      - name: Save verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imperial-verification-evidence
          path: |
            imperial-llm/verified-environment.txt
            imperial-llm/verification-tests.xml
          retention-days: 7
