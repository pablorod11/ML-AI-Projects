name: Imperial bounded late refinement
on:
  push:
    branches: [imperial-late-refinement-2026-10-30]
    paths: [".github/workflows/imperial-refinement.yml"]
permissions:
  contents: read
jobs:
  train-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: imperial-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install previously verified CPU runtime
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-linux-verified.txt
          python -m pip freeze > refinement-environment.txt
      - name: Check guards and experiment gates
        run: |
          python -m unittest discover -s scripts -p test_late_refinement.py -v
          python -m pytest -q tests/test_checkpoint_security.py tests/test_checkpoint_io.py tests/test_checkpoint_resume.py tests/test_wide_budget.py
      - name: Train matched learning-rate policies
        run: python -u scripts/late_refinement.py --root . --output experiments/late-refinement | tee refinement.log
      - name: Verify both browser exports
        run: |
          node experiments/late-refinement/constant/test_inference.cjs
          node experiments/late-refinement/constant/test_generation.cjs
          node experiments/late-refinement/cosine/test_inference.cjs
          node experiments/late-refinement/cosine/test_generation.cjs
      - name: Preserve artifacts, including failed-run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: imperial-late-refinement-evidence
          path: |
            imperial-llm/experiments/late-refinement
            imperial-llm/refinement.log
            imperial-llm/refinement-environment.txt
          retention-days: 30
